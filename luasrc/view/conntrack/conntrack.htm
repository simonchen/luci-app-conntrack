<%+header%>
<style type="text/css">
	.fixed-table {
		width: 100%;
	/*	table-layout: fixed !important; */
		border-collapse: collapse;
	}
	.text-ellipsis {
		white-space: nowrap !important;
		overflow: hidden !important;
		text-overflow: ellipsis !important;
		word-break: break-all;
	}
	.unit-toggle {
		cursor: pointer;
		padding: 2px 6px;
		background: #f0f0f0;
		border: 1px solid #ccc;
		border-radius: 3px;
		margin-left: 5px;
		font-size: 11px;
		color: #333;
		user-select: none;
		display: inline-block;
		vertical-align: middle;
	}
	.unit-toggle:hover {
		background: #e0e0e0;
		border-color: #999;
	}
	.table-responsive-wrapper {
		width: 100%;
		overflow-x: auto !important;
		-webkit-overflow-scrolling: touch;
		margin-bottom: 15px;
	}
	.conntrack-table th, .conntrack-table td {
		white-space: nowrap !important;
	}
	@media screen and (min-width: 992px) {
		.ip-col-limit {
			max-width: 260px !important;
		}
	}
	@media screen and (max-width: 991px) {
		.ip-col-limit {
			max-width: 180px !important;
		}
	}
</style>

<div class="cbi-map">
	<h2 class="title"><%:ConnTrack%></h2>
	<div class="cbi-map-descr"><%:Realtime single-direction traffic speed flow based on Event-Stream (SSE).%></div>
	
	<fieldset class="cbi-section">
		<div class="cbi-section-node">
			<div class="cbi-value">
				<label class="cbi-value-title" for="interval_select"><%:Interval (Seconds)%></label>
				<div class="cbi-value-field">
					<select class="cbi-input-select" id="interval_select">
						<option value="1000" selected>1.0s</option>
						<option value="1500">1.5s</option>
						<option value="2000">2.0s</option>
						<option value="2500">2.5s</option>
						<option value="3000">3.0s</option>
						<option value="3500">3.5s</option>
						<option value="4000">4.0s</option>
						<option value="4500">4.5s</option>
						<option value="5000">5.0s</option>
						<option value="5500">5.5s</option>
						<option value="6000">6.0s</option>
						<option value="6500">6.5s</option>
						<option value="7000">7.0s</option>
						<option value="7500">7.5s</option>
						<option value="8000">8.0s</option>
						<option value="8500">8.5s</option>
						<option value="9000">9.0s</option>
						<option value="9500">9.5s</option>
						<option value="10000">10.0s</option>
					</select>
				</div>
			</div>
			<div class="cbi-value">
				<label class="cbi-value-title" for="rows_select"><%:Display Rows%></label>
				<div class="cbi-value-field">
					<select class="cbi-input-select" id="rows_select">
						<option value="10">10</option>
						<option value="20">20</option>
						<option value="30">30</option>
						<option value="40">40</option>
						<option value="50" selected>50</option>
						<option value="60">60</option>
						<option value="70">70</option>
						<option value="80">80</option>
						<option value="90">90</option>
						<option value="100">100</option>
					</select>
				</div>
			</div>
			<div class="cbi-value">
				<label class="cbi-value-title"><%:Actual Delta Time%></label>
				<div class="cbi-value-field" id="delta_label" style="font-weight:bold; color:#0071c5; line-height:2.5em; display:inline-block; vertical-align:middle;">0.0000s</div>
			</div>
		</div>
	</fieldset>

	<fieldset class="cbi-section">
		<table class="table cbi-section-table fixed-table" id="conntrack_table" style="width:100%; text-align:left;">
			<tr class="cbi-section-table-titles">
				<th class="cbi-section-table-cell" style="width:8%;"><%:L3%></th>
				<th class="cbi-section-table-cell" style="width:10%;"><%:Protocol%></th>
				<th class="cbi-section-table-cell text-ellipsis ip-col-limit" style="width:17%;"><%:State (Direction)%></th>
				<th class="cbi-section-table-cell text-ellipsis ip-col-limit" style="width:23%;"><%:Source IP:Port%></th>
				<th class="cbi-section-table-cell" style="width:23%;"><%:Destination IP:Port%></th>
				<th class="cbi-section-table-cell" style="width:11%;"><%:Accumulated%></th>
				<th class="cbi-section-table-cell" style="width:11%;">
					<%:Current Speed%><span id="toggle_btn" class="unit-toggle">Bit</span>
				</th>
			</tr>
			<tr class="cbi-section-table-row"><td colspan="7" style="text-align:center;" id="loading_msg"><%:Connecting to Event-Stream...%></td></tr>
		</table>
	</fieldset>
</div>

<script type="text/javascript">//<![CDATA[
	var eventSource = null;
	var currentUnit = 'Bit';
	var lastCacheData = null;

	function formatSpeed(bytesPerSec) {
		if (currentUnit === 'Bit') {
			var bitsPerSec = bytesPerSec * 8;
			if (bitsPerSec >= 1000 * 1000 * 1000) return (bitsPerSec / 1000 / 1000 / 1000).toFixed(2) + ' Gbps';
			if (bitsPerSec >= 1000 * 1000) return (bitsPerSec / 1000 / 1000).toFixed(2) + ' Mbps';
			if (bitsPerSec >= 1000) return (bitsPerSec / 1000).toFixed(2) + ' Kbps';
			return bitsPerSec + ' bps';
		} else {
			if (bytesPerSec >= 1024 * 1024) return (bytesPerSec / 1024 / 1024).toFixed(2) + ' MB/s';
			if (bytesPerSec >= 1024) return (bytesPerSec / 1024).toFixed(2) + ' KB/s';
			return bytesPerSec + ' B/s';
		}
	}

	function formatBytes(bytes) {
		if (bytes >= 1024 * 1024 * 1024) return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
		if (bytes >= 1024 * 1024) return (bytes / 1024 / 1024).toFixed(2) + ' MB';
		return (bytes / 1024).toFixed(2) + ' KB';
	}

	function renderTable(data) {
		var table = document.getElementById('conntrack_table');
		while (table.rows.length > 1) {
			table.deleteRow(1);
		}

		if (data.connections.length === 0) {
			var row = table.insertRow(-1);
			row.className = 'cbi-section-table-row';
			var cell = row.insertCell(0);
			cell.colSpan = 7;
			cell.style.textAlign = 'center';
			cell.innerHTML = '<%:No active traffic speed detected...%>';
			return;
		}

		data.connections.forEach(function(conn) {
			var row = table.insertRow(-1);
			row.className = 'cbi-section-table-row';

			var src_full = conn.src + ':' + conn.sport;
			var dst_full = conn.dst + ':' + conn.dport;
			var speedStr = formatSpeed(conn.speed);

			var c0 = row.insertCell(0); c0.className = 'text-ellipsis'; c0.innerHTML = conn.l3.toUpperCase(); c0.title = conn.l3.toUpperCase();
			var c1 = row.insertCell(1); c1.className = 'text-ellipsis'; c1.innerHTML = '<strong>' + conn.proto.toUpperCase() + '</strong>'; c1.title = conn.proto.toUpperCase();
			var c2 = row.insertCell(2); c2.className = 'text-ellipsis'; c2.innerHTML = conn.state; c2.title = conn.state;
			
			var c3 = row.insertCell(3); c3.className = 'text-ellipsis ip-col-limit'; c3.innerHTML = src_full; c3.title = src_full;
			var c4 = row.insertCell(4); c4.className = 'text-ellipsis ip-col-limit'; c4.innerHTML = dst_full; c4.title = dst_full;
			
			var c5 = row.insertCell(5); c5.className = 'text-ellipsis'; c5.innerHTML = formatBytes(conn.bytes); c5.title = formatBytes(conn.bytes);
			var c6 = row.insertCell(6); c6.className = 'text-ellipsis'; c6.innerHTML = '<span style="color:#468847; font-weight:bold;">' + speedStr + '</span>'; c6.title = speedStr;
		});
	}

	function startStream() {
		if (eventSource) {
			eventSource.close();
		}

		var interval = document.getElementById('interval_select').value;
		var rows = document.getElementById('rows_select').value;
		var url = '<%=luci.dispatcher.build_url("admin", "network", "conntrack_stream")%>' + '?interval=' + interval + '&rows=' + rows;

		eventSource = new EventSource(url);

		eventSource.onmessage = function(event) {
			var loading = document.getElementById('loading_msg');
			if (loading) loading.style.display = 'none';

			var data = JSON.parse(event.data);
			document.getElementById('delta_label').innerHTML = data.delta + 's';
			lastCacheData = data;

			renderTable(data);
		};

		eventSource.onerror = function(err) {
			console.error("EventSource failed:", err);
			var loading = document.getElementById('loading_msg');
			if (loading) {
				loading.style.display = 'table-cell';
				loading.innerHTML = '<span style="color:red;"><%:Stream connection lost, retrying...%></span>';
			}
		};
	}

	document.getElementById('toggle_btn').addEventListener('click', function() {
		if (currentUnit === 'Bit') {
			currentUnit = 'B';
			this.innerHTML = 'B';
		} else {
			currentUnit = 'Bit';
			this.innerHTML = 'Bit';
		}
		if (lastCacheData) {
			renderTable(lastCacheData);
		}
	});

	document.getElementById('interval_select').addEventListener('change', startStream);
	document.getElementById('rows_select').addEventListener('change', startStream);
	window.addEventListener('DOMContentLoaded', startStream);
//]]></script>
<%+footer%>
